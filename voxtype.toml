# Jarvis STT config: multilingual whisper (FR+EN), used via `voxtype -c`.
#
# Trois lignes, et c'est tout ce que `voxtype … transcribe` lit. Ce fichier
# a longtemps porté la configuration d'exemple du fournisseur — state_file,
# [hotkey], [audio], [output], [text] : quatre-vingt-neuf lignes pour un
# démon que Jarvis ne lance pas, un raccourci clavier qu'Hyprland gère, et
# des retours audio que la voix fait elle-même. Vérifié en transcrivant le
# même wav avec l'ancien fichier et celui-ci : sortie identique, exit 0.
#
# `language` est réécrite à la volée par bin/jarvis (voir do_transcribe) :
# l'âme épingle fr, en ou auto, parce que la détection automatique de
# whisper est peu fiable sur les clips courts.

[whisper]
model = "small"
language = "auto"
