# The offline suite, on a machine that has never heard of Omarchy.
#
# That is the point of running it here rather than only on the author's
# laptop: tests/run claims to need no quota, no network, no sound and no
# microphone, and a bare Ubuntu runner is the only place that claim can be
# checked honestly. Everything the voice path touches — claude, piper,
# voxtype, pw-record, pw-play, omarchy-shell — is faked in tests/bin, and
# the state, memory and exchange box are redirected into a sandbox by the
# JARVIS_* overrides.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: offline suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The suite writes and reads French, and asserts on accented strings.
      # A runner defaulting to the C locale would compare bytes it cannot
      # decode, so the language is pinned rather than inherited.
      - name: The suite
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          TZ: Europe/Brussels
        run: ./tests/run

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint every shipped script
        run: |
          shellcheck --version
          shellcheck -S warning -x bin/jarvis bin/jarvis-fsm.sh bin/jarvis-wake \
            install.sh bootstrap.sh tests/run
